[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wefe-newspaper-analysis"
version = "0.1.0"
description = "Scaffold for PDF-based newspaper text analysis and WEFE workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "pypdf>=4.2,<6",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
  "wefe>=0.4.1,<0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1,<9",
  "ruff>=0.4,<0.8",
]

[project.scripts]
wefe-news = "wefe_news_analysis.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

