project:
  name: "newspaper-bias-audit"

corpus:
  raw_pdf_dir: "data/raw/sz_txt"
  processed_text_dir: "data/raw/sz_txt"
  article_glob: "*.pdf"
  text_glob: "*.txt"
  language: "german"
  default_encoding: "utf-8"

metadata:
  sidecar_csv_path: null
  id_column: "article_id"

preprocessing:
  normalize_unicode: true
  lowercase: true
  collapse_whitespace: true
  strip_punctuation: false
  strip_digits: false
  min_token_length: 2
  stopword_handling: "keep"
  ocr_cleanup: true

embeddings:
  path: "models/embeddings.kv"
  format: "keyedvectors"
  binary: false
  model_name: "newspaper-keyedvectors"

output:
  manifest_path: "data/processed/articles_manifest.csv"
  reports_dir: "reports"

analysis:
  target_groups:
    palestinians: ["palästinenser", "palästinensische", "gaza", "palästina"]
    israelis: ["israelis", "israelische", "israel"]
    palestinian_journalists: ["palästinensische journalisten", "journalisten aus gaza", "medienarbeiter aus gaza"]
    general_journalists: ["journalisten", "reporter", "korrespondenten", "medien"]
  framing_lexicons:
    dehumanizing: ["flut", "welle", "plage", "parasiten", "ungeziefer", "invasion"]
    criminalizing: ["illegal", "kriminalität", "kriminell", "bande", "bedrohung", "verdächtig"]
    collectivizing: ["der feind", "die palästinenser", "die migranten", "feindvolk"]
    erasure_of_civilian_status: ["hamas-nah", "nicht-zivilisten", "schutzschild"]
    incitement_displacement: ["vertreiben", "umsiedeln", "zwangsumsiedlung"]
    incitement_destruction: ["dem erdboden gleichmachen", "auslöschen", "vernichten"]
    discrediting_journalists: ["terrorpropaganda", "hamas-sprachrohr", "falschmeldung"]
    censorship_repression: ["einschüchterung", "zensur", "informationssperre", "zugangsverbot"]
    victimizing: ["opfer", "schutzlos", "vertrieben", "leidend", "hilflos"]
    humanizing: ["familie", "arbeiter", "gemeinschaft", "nachbar", "mensch", "menschen"]
    violence_positive: ["selbstverteidigung", "unbewaffnet", "reaktion", "gegenangriff", "opfer", "abwehr", "zivilisten", "verteidigungsstreitkräfte", "sicherheitskräfte", "verteidigung"]
    violence_negative: ["terrorist", "mörder", "islamist", "barbarisch", "extrem", "extremist", "gewalttätig", "vergeltungsschlag", "zivile ziele", "kaltblütig", "sprachrohr der hamas & des terrorismus", "militant"]
    ideology_positive: ["liberal", "demokratisch", "rational", "friedlich"]
    ideology_negative: ["radikal", "extremist", "bruderschaft", "islamist", "terrorist", "fundamentalist", "radikalislamist", "palästinensermiliz", "miliz"]
    language_of_death_direct: ["mord", "ermordet", "massaker"]
    language_of_death_euphemistic: ["tod", "gestorben", "tot", "leben verloren", "umkommen", "sterben"]
    adjectives_positive: ["vernünftig", "rational", "angemessen", "zumutbar", "vertretbar", "gerecht", "gerechtfertigt", "arm", "unschuldig", "strategisch"]
    adjectives_negative: ["impulsiv", "wütend", "gewalttätig", "extrem", "barbarisch", "gräuel", "gräueltat", "grauenhaft", "horror", "suspekt"]
    political_legitimacy: ["existenzrecht", "staatsräson", "flucht", "flüchtling", "zuflucht", "zufluchtsort"]
    credibility_positive: ["wahrheit", "staat"]
    credibility_negative: ["angeblich", "mutmaßlich", "behauptung", "behaupten", "lüge", "lügen"]
    emotion_trauma: ["trauma", "traumatisiert"]
    journalist_professionalism_positive: ["objektiv", "neutral", "professionell", "unabhängig", "unabhängigkeit", "akkurat", "korrekt", "genau"]
    journalist_professionalism_negative: ["propagandist", "propaganda", "agent", "komplize", "gehilfe", "mittäter", "kollaborateur", "sympathisant", "gestellt", "inszeniert", "arrangiert", "nicht unabhängig", "jihad"]
  context_window_tokens: 8
  parser_model: "de_core_news_sm"
  outputs:
    sentence_features_path: "reports/sentence_representation_features.csv"
    article_group_features_path: "reports/article_group_representation_features.csv"

