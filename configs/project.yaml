project:
  name: "newspaper-bias-audit"

corpus:
  raw_pdf_dir: "data/raw/sz_txt"
  processed_text_dir: "data/raw/sz_txt"
  article_glob: "*.pdf"
  text_glob: "*.txt"
  language: "german"
  default_encoding: "utf-8"

metadata:
  sidecar_csv_path: null
  id_column: "article_id"

preprocessing:
  normalize_unicode: true
  lowercase: true
  collapse_whitespace: true
  strip_punctuation: false
  strip_digits: false
  min_token_length: 2
  stopword_handling: "keep"
  ocr_cleanup: true

embeddings:
  path: "models/embeddings.kv"
  format: "keyedvectors"
  binary: false
  model_name: "newspaper-keyedvectors"

output:
  manifest_path: "data/processed/articles_manifest.csv"
  reports_dir: "reports"

analysis:
  target_groups:
    palestinians: ["palästinenser", "palästinensische", "gaza", "palästina"]
    israelis: ["israelis", "israelische", "israel"]
    palestinian_journalists: ["palästinensische journalisten", "journalisten aus gaza", "medienarbeiter aus gaza"]
    general_journalists: ["journalisten", "reporter", "korrespondenten", "medien"]
  framing_lexicons:
    dehumanizing: ["flut", "welle", "plage", "parasiten", "ungeziefer", "invasion"]
    criminalizing: ["illegal", "kriminalität", "kriminell", "bande", "bedrohung", "verdächtig"]
    collectivizing: ["der feind", "die palästinenser", "die migranten", "feindvolk"]
    erasure_of_civilian_status: ["hamas-nah", "nicht-zivilisten", "schutzschild"]
    incitement_displacement: ["vertreiben", "umsiedeln", "zwangsumsiedlung"]
    incitement_destruction: ["dem erdboden gleichmachen", "auslöschen", "vernichten"]
    discrediting_journalists: ["terrorpropaganda", "hamas-sprachrohr", "falschmeldung"]
    censorship_repression: ["einschüchterung", "zensur", "informationssperre", "zugangsverbot"]
    victimizing: ["opfer", "schutzlos", "vertrieben", "leidend", "hilflos"]
    humanizing: ["familie", "arbeiter", "gemeinschaft", "nachbar", "mensch", "menschen"]
  context_window_tokens: 8
  parser_model: "de_core_news_sm"
  outputs:
    sentence_features_path: "reports/sentence_representation_features.csv"
    article_group_features_path: "reports/article_group_representation_features.csv"

wefe:
  word_sets:
    palestinian_journalists: ["palästinensische", "journalisten", "gaza", "medienarbeiter"]
    general_journalists: ["journalisten", "reporter", "korrespondenten", "medien"]
    dehumanizing_terms: ["flut", "welle", "plage", "parasiten", "ungeziefer", "invasion"]
    collectivizing_terms: ["feind", "feindvolk", "masse", "welle", "flut"]
    erasure_civilian_status_terms: ["hamas-nah", "nicht-zivilisten", "schutzschild"]
    criminalizing_terms: ["illegal", "kriminalität", "kriminell", "bande", "bedrohung", "verdächtig"]
    displacement_terms: ["vertreiben", "umsiedeln", "zwangsumsiedlung"]
    destruction_terms: ["auslöschen", "vernichten", "zerstören"]
    discrediting_journalist_terms: ["terrorpropaganda", "hamas-sprachrohr", "falschmeldung"]
    censorship_repression_terms: ["einschüchterung", "zensur", "informationssperre", "zugangsverbot"]
    victimizing_terms: ["opfer", "schutzlos", "vertrieben", "leidend", "hilflos"]
    humanizing_terms: ["familie", "arbeiter", "gemeinschaft", "nachbar", "mensch", "menschen", "zivilisten"]

    migration_groups: ["migranten", "flüchtlinge", "asylbewerber", "zuwanderer", "einwanderer"]
    roma_people: ["roma", "romani", "sinti"]

    palestinians: ["palästinenser", "palästinensische", "gaza", "palästina"]
    israelis: ["israelis", "israelische", "israel"]
    terrorism_terms: ["terror", "terrorismus", "terroristen", "militante", "angriffe", "raketen", "gewalt", "bedrohung"]
    defense_terms: ["verteidigung", "sicherheit", "opfer", "frieden", "humanität"]

  experiments:
    journalist_discrediting:
      metric: "WEAT"
      description: "Compare Palestinian journalist references against general journalist references under discrediting versus humanizing framing."
      target_sets: ["palestinian_journalists", "general_journalists"]
      attribute_sets: ["discrediting_journalist_terms", "humanizing_terms"]

    palestinian_terrorism_bias:
      metric: "WEAT"
      description: "Measure bias by comparing association of Palestinians vs Israelis with terrorism terms vs defense terms. A positive effect size indicates Palestinians are more associated with terrorism than Israelis with defense."
      target_sets: ["palestinians", "israelis"]
      attribute_sets: ["terrorism_terms", "defense_terms"]

    palestinian_dehumanization_bias:
      metric: "WEAT"
      description: "Assess dehumanization bias by comparing Palestinians and Israelis under dehumanizing vs humanizing terms."
      target_sets: ["palestinians", "israelis"]
      attribute_sets: ["dehumanizing_terms", "humanizing_terms"]

    palestinian_criminalization_bias:
      metric: "WEAT"
      description: "Evaluate criminalization bias by comparing Palestinians and Israelis under criminalizing vs humanizing terms."
      target_sets: ["palestinians", "israelis"]
      attribute_sets: ["criminalizing_terms", "humanizing_terms"]
