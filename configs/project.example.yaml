project:
  name: "newspaper-bias-audit"

corpus:
  raw_pdf_dir: "data/raw/pdfs"
  raw_text_dir: "data/raw/text"
  processed_text_dir: "data/processed/text"
  article_glob: "*.pdf"
  text_glob: "*.txt"
  language: "german"
  default_encoding: "utf-8"

metadata:
  sidecar_csv_path: "data/raw/article_metadata.csv"
  id_column: "article_id"

preprocessing:
  normalize_unicode: true
  lowercase: true
  collapse_whitespace: true
  strip_punctuation: true
  strip_digits: false
  min_token_length: 2
  stopword_handling: "keep"
  ocr_cleanup: true

embeddings:
  path: "models/embeddings.kv"
  format: "keyedvectors"
  binary: false
  model_name: "newspaper-keyedvectors"
  vector_size: 100
  window: 5
  min_count: 1
  epochs: 10
  sg: 1

output:
  manifest_path: "data/processed/articles_manifest.csv"
  reports_dir: "reports"

analysis:
  target_groups:
    palestinians: ["palästinenser", "palästinensern", "palästinensische", "palästinensischen", "palästinensischer", "palästinenserinnen", "palästina", "gaza", "gazas", "gazastreifen", "gazastreifens"]
